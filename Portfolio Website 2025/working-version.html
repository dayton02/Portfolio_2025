<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Debug Version</title>
    
    <!-- Critical CSS inline -->
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif;
            background: #13111C;
            color: white;
            line-height: 1.6;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(19, 17, 28, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .hero-container {
            display: flex;
            padding: 4rem 2rem;
            gap: 4rem;
            align-items: center;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }
        .hero-left, .hero-right {
            flex: 1;
        }
        h1 { color: #B197FC; font-size: 3rem; margin-bottom: 1rem; }
        .role { color: #845EF7; font-size: 1.5rem; }
        .terminal-window {
            background: rgba(26, 22, 37, 0.7);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(177, 151, 252, 0.2);
        }
        .code-display {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #B197FC;
            white-space: pre-wrap;
        }
        .cta-button {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #845EF7, #B197FC);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin: 0.5rem;
            transition: transform 0.3s ease;
        }
        .cta-button:hover { transform: translateY(-2px); }
        @media (max-width: 768px) {
            .hero-container { flex-direction: column; text-align: center; }
        }
    </style>
    
    <!-- Enhanced Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div style="text-align: center;">
            <h2 style="color: #B197FC;">Loading Portfolio...</h2>
            <div style="width: 200px; height: 4px; background: rgba(132, 94, 247, 0.2); border-radius: 2px; margin: 1rem auto;">
                <div style="width: 100%; height: 100%; background: linear-gradient(90deg, #845EF7, #B197FC); border-radius: 2px; animation: loading 1.5s ease-in-out;"></div>
            </div>
        </div>
    </div>

    <!-- Hero Section -->
    <section id="hero">
        <div class="hero-container">
            <div class="hero-left">
                <h1>Hello! I'm Dayton Ng</h1>
                <p class="role">Game Developer | Software Engineer</p>
                <p>Welcome to my portfolio space!</p>
                <div style="margin-top: 2rem;">
                    <a href="#about" class="cta-button">About Me</a>
                    <a href="projects.html" class="cta-button">View Projects</a>
                </div>
            </div>
            <div class="hero-right">
                <div class="terminal-window">
                    <div class="code-display" id="code-display">// Loading code...
// This will type out automatically</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Simple typing animation -->
    <script>
        // Simple typing animation for the terminal
        const code = `class DaytonNg {
    private:
        string name = "Dayton Ng";
        string title = "Game Developer | Software Engineer";
        vector<string> skills = {
            "Unity", "Unreal", "C++", "C#"
        };
        bool hardWorker = true;
        bool eagerLearner = true;
        bool isStudent = true;
    public:
        bool isHireable() {
            return !isStudent;
        }
};`;

        function typeCode() {
            const element = document.getElementById('code-display');
            if (!element) return;
            
            let i = 0;
            element.textContent = '';
            
            function type() {
                if (i < code.length) {
                    element.textContent += code.charAt(i);
                    i++;
                    setTimeout(type, 30);
                }
            }
            
            setTimeout(type, 1000);
        }
        
        // Hide loading screen
        function hideLoading() {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }
        }
        
        // Start everything when page loads
        window.addEventListener('load', () => {
            setTimeout(hideLoading, 1500);
            typeCode();
        });
        
        // Fallback: hide loading after 5 seconds max
        setTimeout(hideLoading, 5000);
    </script>
</body>
</html>
