<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Loading Diagnostic</title>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #13111C; 
            color: #ffffff; 
            padding: 20px; 
            line-height: 1.6;
        }
        .diagnostic-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { 
            color: #B197FC; 
            text-align: center; 
            margin-bottom: 30px;
        }
        .test-section {
            background: rgba(26, 22, 37, 0.8);
            border: 1px solid rgba(177, 151, 252, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        .test-section h2 {
            color: #845EF7;
            margin-top: 0;
            border-bottom: 2px solid rgba(132, 94, 247, 0.3);
            padding-bottom: 10px;
        }
        .image-test {
            display: inline-block;
            margin: 10px;
            text-align: center;
            background: rgba(19, 17, 28, 0.9);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(177, 151, 252, 0.1);
            transition: transform 0.3s ease;
        }
        .image-test:hover {
            transform: translateY(-2px);
            border-color: rgba(132, 94, 247, 0.3);
        }
        .image-test img {
            max-width: 150px;
            max-height: 150px;
            border-radius: 6px;
            display: block;
            margin: 0 auto 10px;
        }
        .status {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .status.loaded { background: #27ae60; color: white; }
        .status.failed { background: #e74c3c; color: white; }
        .status.loading { background: #f39c12; color: white; }
        .status.lazy { background: #3498db; color: white; }
        .console-output {
            background: #1a1a1a;
            color: #00ff00;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            padding: 15px;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .error-log {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
        }
        .loading-placeholder {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, rgba(132, 94, 247, 0.1), rgba(177, 151, 252, 0.05));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #845EF7;
            font-size: 11px;
            text-align: center;
            margin: 0 auto 10px;
        }
        .summary-stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .stat-box {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: rgba(132, 94, 247, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(132, 94, 247, 0.2);
        }
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #B197FC;
        }
        .stat-label {
            font-size: 12px;
            color: #845EF7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
    
    <!-- Enhanced Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="diagnostic-container">
        <h1>🔍 Portfolio Image Loading Diagnostic</h1>
        
        <div class="test-section">
            <h2>📊 Test Summary</h2>
            <div class="summary-stats">
                <div class="stat-box">
                    <div class="stat-number" id="total-images">0</div>
                    <div class="stat-label">Total Images</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="loaded-images">0</div>
                    <div class="stat-label">Loaded</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="failed-images">0</div>
                    <div class="stat-label">Failed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="lazy-images">0</div>
                    <div class="stat-label">Lazy Loading</div>
                </div>
            </div>
            <div id="error-summary"></div>
        </div>

        <div class="test-section">
            <h2>🖼️ Main Page Images</h2>
            <div id="main-page-images"></div>
        </div>

        <div class="test-section">
            <h2>📱 Projects Page Images</h2>
            <div id="project-images"></div>
        </div>

        <div class="test-section">
            <h2>🎨 Gallery Images</h2>
            <div id="gallery-images"></div>
        </div>

        <div class="test-section">
            <h2>⚙️ Lazy Loading Test</h2>
            <div id="lazy-loading-test"></div>
        </div>

        <div class="test-section">
            <h2>🐛 Error Console</h2>
            <div id="error-console" class="console-output">No errors detected yet...</div>
        </div>

        <div class="test-section">
            <h2>💡 Common Issues & Solutions</h2>
            <div id="solutions"></div>
        </div>
    </div>

    <script>
        // Image diagnostic tool
        class ImageDiagnostic {
            constructor() {
                this.images = [];
                this.errors = [];
                this.loaded = 0;
                this.failed = 0;
                this.lazy = 0;
                this.init();
            }

            init() {
                this.setupErrorTracking();
                this.testAllImages();
                this.displaySolutions();
            }

            setupErrorTracking() {
                window.addEventListener('error', (e) => {
                    if (e.target && e.target.tagName === 'IMG') {
                        this.errors.push(`Image failed to load: ${e.target.src} - ${e.message}`);
                        this.updateErrorConsole();
                    }
                }, true);
            }

            testAllImages() {
                // Test main page images
                this.testMainPageImages();
                
                // Test project images (from JavaScript arrays)
                this.testProjectImages();
                
                // Test lazy loading
                this.testLazyLoading();
                
                // Update stats after a delay
                setTimeout(() => this.updateStats(), 2000);
            }

            testMainPageImages() {
                const mainImages = [
                    { src: 'images/profile.jpg', alt: 'Profile Picture', type: 'Profile' },
                    { src: 'images/featured-project.jpg', alt: 'Featured Project', type: 'Project' },
                    { src: 'images/apple-touch-icon.png', alt: 'Apple Touch Icon', type: 'Icon' },
                    { src: 'images/favicon-32x32.png', alt: 'Favicon 32x32', type: 'Icon' },
                    { src: 'images/favicon-16x16.png', alt: 'Favicon 16x16', type: 'Icon' }
                ];

                this.testImageSet(mainImages, 'main-page-images');
            }

            testProjectImages() {
                const projectImages = [
                    { src: 'images/featured-project.jpg', alt: 'Climb Game', type: 'Climb' },
                    { src: 'images/mkb.jpg', alt: 'Monkey Business', type: 'Monkey Business' },
                    { src: 'images/exodis.png', alt: 'Exodis Ascend', type: 'Exodis' },
                    { src: 'images/leadAstray.png', alt: 'Lead Astray', type: 'Lead Astray' },
                    { src: 'images/Room.png', alt: 'Room 3D Model', type: 'Room' },
                    { src: 'images/Chair.png', alt: 'Chair 3D Model', type: 'Chair' },
                    { src: 'images/gameboy.png', alt: 'Gameboy 3D Model', type: 'Gameboy' },
                    { src: 'images/keyboard.png', alt: 'Keyboard 3D Model', type: 'Keyboard' }
                ];

                this.testImageSet(projectImages, 'project-images');
            }

            testImageSet(imageSet, containerId) {
                const container = document.getElementById(containerId);
                if (!container) return;

                imageSet.forEach(imageData => {
                    const imageTest = document.createElement('div');
                    imageTest.className = 'image-test';
                    
                    const img = document.createElement('img');
                    const placeholder = document.createElement('div');
                    placeholder.className = 'loading-placeholder';
                    placeholder.textContent = 'Loading...';
                    
                    imageTest.appendChild(placeholder);
                    
                    const status = document.createElement('div');
                    status.className = 'status loading';
                    status.textContent = 'Loading...';
                    
                    const info = document.createElement('div');
                    info.style.fontSize = '10px';
                    info.style.color = '#845EF7';
                    info.textContent = imageData.type;
                    
                    imageTest.appendChild(status);
                    imageTest.appendChild(info);
                    
                    // Test image loading
                    img.onload = () => {
                        placeholder.style.display = 'none';
                        imageTest.insertBefore(img, status);
                        status.className = 'status loaded';
                        status.textContent = 'Loaded';
                        this.loaded++;
                        this.updateStats();
                    };
                    
                    img.onerror = () => {
                        placeholder.style.display = 'none';
                        const errorDiv = document.createElement('div');
                        errorDiv.style.width = '150px';
                        errorDiv.style.height = '150px';
                        errorDiv.style.background = 'rgba(231, 76, 60, 0.1)';
                        errorDiv.style.border = '2px dashed #e74c3c';
                        errorDiv.style.borderRadius = '6px';
                        errorDiv.style.display = 'flex';
                        errorDiv.style.alignItems = 'center';
                        errorDiv.style.justifyContent = 'center';
                        errorDiv.style.color = '#e74c3c';
                        errorDiv.style.fontSize = '11px';
                        errorDiv.style.textAlign = 'center';
                        errorDiv.innerHTML = '❌<br>Failed to load';
                        imageTest.insertBefore(errorDiv, status);
                        
                        status.className = 'status failed';
                        status.textContent = 'Failed';
                        this.failed++;
                        this.updateStats();
                        this.errors.push(`Failed to load: ${imageData.src}`);
                        this.updateErrorConsole();
                    };
                    
                    img.src = imageData.src;
                    img.alt = imageData.alt;
                    
                    container.appendChild(imageTest);
                    this.images.push(imageData);
                });
            }

            testLazyLoading() {
                const container = document.getElementById('lazy-loading-test');
                if (!container) return;

                // Test lazy loading functionality
                const testDiv = document.createElement('div');
                testDiv.innerHTML = `
                    <div style="margin: 20px 0;">
                        <h3>Testing Lazy Loading Mechanism</h3>
                        <div id="lazy-test-results"></div>
                    </div>
                `;
                container.appendChild(testDiv);

                const resultsDiv = document.getElementById('lazy-test-results');
                
                // Check if IntersectionObserver is available
                if ('IntersectionObserver' in window) {
                    resultsDiv.innerHTML += '<div class="success">✅ IntersectionObserver available for lazy loading</div>';
                } else {
                    resultsDiv.innerHTML += '<div class="error">❌ IntersectionObserver not available - fallback needed</div>';
                }

                // Check for lazy loading images
                const lazyImages = document.querySelectorAll('img[data-lazy]');
                resultsDiv.innerHTML += `<div class="info">ℹ Found ${lazyImages.length} images with data-lazy attribute</div>`;
                
                if (lazyImages.length > 0) {
                    this.lazy = lazyImages.length;
                    resultsDiv.innerHTML += '<div class="warning">⚠ Lazy loading images detected - may not load until scrolled</div>';
                }
            }

            updateStats() {
                document.getElementById('total-images').textContent = this.images.length;
                document.getElementById('loaded-images').textContent = this.loaded;
                document.getElementById('failed-images').textContent = this.failed;
                document.getElementById('lazy-images').textContent = this.lazy;
            }

            updateErrorConsole() {
                const console = document.getElementById('error-console');
                if (this.errors.length > 0) {
                    console.innerHTML = this.errors.join('<br>');
                }
            }

            displaySolutions() {
                const solutions = document.getElementById('solutions');
                solutions.innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;">
                        <div class="error-log">
                            <strong>🖼️ Image Not Found</strong><br>
                            Check if image file exists in the correct folder<br>
                            Verify file path and filename spelling<br>
                            Ensure file extension matches (.jpg vs .jpeg)
                        </div>
                        <div class="error-log">
                            <strong>📁 Wrong Path</strong><br>
                            Use relative paths from HTML file location<br>
                            Check folder structure matches your references<br>
                            Verify case sensitivity (Chair.png vs chair.png)
                        </div>
                        <div class="error-log">
                            <strong>🔄 Lazy Loading Issues</strong><br>
                            Images with data-lazy won't load until scrolled<br>
                            Check if IntersectionObserver is supported<br>
                            Verify lazy loading JavaScript is working
                        </div>
                        <div class="error-log">
                            <strong>🌐 File Access</strong><br>
                            Some browsers block local file access<br>
                            Use a local web server for testing<br>
                            Check browser console for security errors
                        </div>
                        <div class="error-log">
                            <strong>📏 Image Size Issues</strong><br>
                            Large images may take time to load<br>
                            Optimize images for web (compress if needed)<br>
                            Consider using WebP format for better performance
                        </div>
                        <div class="error-log">
                            <strong>🔧 Quick Fixes</strong><br>
                    Try opening image directly in browser<br>
                            Check browser developer tools (F12 → Network)<br>
                            Test with simple <img> tag first
                        </div>
                    </div>
                `;
            }
        }

        // Initialize diagnostic when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ImageDiagnostic();
        });
    </script>
</body>
</html>
